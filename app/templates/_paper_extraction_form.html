    <form method="post" action="{{ url_for('papers.extraction') }}" class="extraction-toolbar" id="extraction-form">
        <details class="mb-3"><summary>Additional URL or pasted text</summary>
        <label for="paper-url" class="form-label">Additional paper URL (arXiv abs / html / pdf)</label>
        <input id="paper-url" name="url" type="url" class="form-control mb-3" value="{{ request.form.get('url', '') }}" placeholder="https://arxiv.org/abs/2601.12345">
        <label for="source-text" class="form-label">Optional pasted abstract / paper text (uses the URL above as provenance, without downloading it)</label>
        <textarea id="source-text" name="source_text" class="form-control mb-3" rows="5" maxlength="100000">{{ request.form.get('source_text', '') }}</textarea>
        </details>
        <p><strong id="selection-count">0 papers selected</strong> · Select up to 10 papers above.</p>
        <label for="source-mode">Source scope</label>
        <select id="source-mode" name="mode" class="form-select mb-3">
            <option value="abstract">Abstract (recommended first)</option>
            <option value="full_text" {% if request.form.get('mode') == 'full_text' %}selected{% endif %}>Full HTML paper</option>
        </select>
        <label for="model">OpenAI model ID available to your API account</label>
        <input id="model" name="model" required class="form-control mb-3" value="{{ request.form.get('model', '') }}" placeholder="Enter model ID">
        <p>Configure OPENAI_API_KEY on the server. Maximum 10 papers per submission. PDF URLs resolve to abstract or HTML; PDF binary parsing is not included.</p>
        <button class="btn btn-primary" id="extract-button" disabled>Extract selected papers</button>
        <span id="progress" role="status"></span>
    </form>
